[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlab"
version = "2.1.0"
description = "AxiomLab (AxLab / AxLCh) v2.1.0 — Unified Closed-Form Perceptual Color Space & Positive-Definite Midpoint Riemannian Metric Tensor"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
]

[project.optional-dependencies]
verify = [
    "scipy>=1.9.0",
]
benchmark = [
    "scipy>=1.9.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tqdm>=4.66.0",
    "colour-science>=0.4.6",
    "helmlab>=1.0.0",
]

[tool.setuptools]
py-modules = ["axiomlab", "baselines", "build_datasets"]
