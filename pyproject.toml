[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "axiomlab"
version = "2.1.0"
description = "AxiomLab (AxLab / AxLCh) v2.1.0 — Unified Closed-Form Perceptual Color Space & Positive-Definite Midpoint Riemannian Metric Tensor"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22.0",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Multimedia :: Graphics :: Color",
    "Topic :: Scientific/Engineering :: Image Processing",
]

[project.urls]
Homepage = "https://kerneldroid.github.io/axiomlab/"
Playground = "https://kerneldroid.github.io/axiomlab/playground/"
Benchmarks = "https://kerneldroid.github.io/axiomlab/benchmarks/"
Repository = "https://github.com/sysv86/axiomlab"
Issues = "https://github.com/sysv86/axiomlab/issues"

[project.optional-dependencies]
verify = [
    "scipy>=1.9.0",
]
benchmark = [
    "scipy>=1.9.0",
    "pandas>=2.0.0",
    "openpyxl>=3.1.0",
    "tqdm>=4.66.0",
    "colour-science>=0.4.6",
    "helmlab>=1.0.0",
]

[tool.setuptools]
# The published wheel is the zero-dependency core. Dataset builders, the
# verifier and the HelmLab harness stay in the repository.
py-modules = ["axiomlab"]
